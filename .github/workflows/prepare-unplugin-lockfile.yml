name: prepare unplugin lockfile

on:
  push:
    branches:
      - agent/add-rolldown-plugin

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/add-rolldown-plugin
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sterashima78'
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated manifests
        run: |
          if git diff --quiet -- pnpm-lock.yaml pnpm-workspace.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "chore: update pnpm lockfile"
          git push
