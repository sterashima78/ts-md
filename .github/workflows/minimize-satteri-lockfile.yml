name: Minimize Satteri lockfile diff

on:
  push:
    branches:
      - agent/use-satteri-markdown-parser
    paths:
      - .github/workflows/minimize-satteri-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/use-satteri-markdown-parser
          fetch-depth: 0
      - run: |
          git show origin/main:pnpm-lock.yaml > pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          content = path.read_text()
          before = """  packages/core:
            dependencies:
              remark-parse:
                specifier: 11.0.0
                version: 11.0.0(supports-color@7.2.0)
              ts-morph:
                specifier: 28.0.0
                version: 28.0.0
              unified:
                specifier: 11.0.5
                version: 11.0.5
              unist-util-visit:
                specifier: 5.1.0
                version: 5.1.0
          """
          after = """  packages/core:
            dependencies:
              satteri:
                specifier: 0.9.5
                version: 0.9.5
              ts-morph:
                specifier: 28.0.0
                version: 28.0.0
          """
          if content.count(before) != 1:
              raise SystemExit('expected core importer block was not found exactly once')
          path.write_text(content.replace(before, after))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git rm .github/workflows/minimize-satteri-lockfile.yml
          git commit -m "Minimize Satteri lockfile changes"
          git push
