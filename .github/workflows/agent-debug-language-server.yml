name: Agent debug language server

on:
  push:
    branches:
      - agent/fix-vscode-intellisense

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sterashima78/ts-md-vscode... build
      - name: Initialize language server
        run: |
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const { pathToFileURL } = require('node:url');
          const path = require('node:path');

          const root = path.resolve('packages/e2e/src/fixtures/error-project');
          const child = spawn(
            process.execPath,
            ['packages/vscode/dist/server/server.js', '--stdio'],
            { stdio: ['pipe', 'pipe', 'pipe'] },
          );

          let output = Buffer.alloc(0);
          let settled = false;
          child.stderr.on('data', (chunk) => process.stderr.write(chunk));
          child.stdout.on('data', (chunk) => {
            output = Buffer.concat([output, chunk]);
            process.stdout.write(chunk);
            if (output.includes(Buffer.from('"id":1'))) {
              settled = true;
              child.kill();
            }
          });
          child.on('exit', (code, signal) => {
            console.error(`server exit code=${code} signal=${signal}`);
            if (!settled) process.exitCode = 1;
          });

          const message = JSON.stringify({
            jsonrpc: '2.0',
            id: 1,
            method: 'initialize',
            params: {
              processId: null,
              rootUri: pathToFileURL(root).toString(),
              capabilities: {},
              workspaceFolders: [
                { uri: pathToFileURL(root).toString(), name: 'error-project' },
              ],
            },
          });
          child.stdin.write(`Content-Length: ${Buffer.byteLength(message)}\r\n\r\n${message}`);

          setTimeout(() => {
            if (!settled) {
              console.error('initialize timed out');
              child.kill();
              process.exitCode = 1;
            }
          }, 15000);
          NODE
