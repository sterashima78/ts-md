name: Update Satteri lockfile

on:
  push:
    branches:
      - agent/use-satteri-markdown-parser
    paths:
      - packages/core/package.json
      - .github/workflows/update-satteri-lockfile.yml

permissions:
  contents: write
  packages: read

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/use-satteri-markdown-parser
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sterashima78'
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git rm .github/workflows/update-satteri-lockfile.yml
          git commit -m "Update lockfile for Satteri"
          git push
