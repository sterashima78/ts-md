name: Minimize Satteri catalog lockfile

on:
  push:
    branches:
      - agent/use-satteri-markdown-parser
    paths:
      - .github/workflows/minimize-satteri-catalog-lockfile.yml

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/use-satteri-markdown-parser
          fetch-depth: 0
      - name: Restore main lockfile and apply minimal changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git show origin/main:pnpm-lock.yaml > pnpm-lock.yaml

          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          content = path.read_text()

          remark_catalog = """    remark-parse:
                specifier: 11.0.0
                version: 11.0.0
          """
          rollup_catalog = """    rollup:
                specifier: 4.62.3
                version: 4.62.3
          """
          satteri_catalog = """    satteri:
                specifier: 0.9.5
                version: 0.9.5
          """
          unified_catalog = """    unified:
                specifier: 11.0.5
                version: 11.0.5
          """
          visit_catalog = """    unist-util-visit:
                specifier: 5.1.0
                version: 5.1.0
          """

          for block in (remark_catalog, unified_catalog, visit_catalog):
              if content.count(block) != 1:
                  raise SystemExit(f'catalog block not found exactly once: {block.splitlines()[0]}')
              content = content.replace(block, '')

          if content.count(rollup_catalog) != 1:
              raise SystemExit('rollup catalog block not found exactly once')
          content = content.replace(rollup_catalog, rollup_catalog + satteri_catalog)

          old_core = """  packages/core:
                dependencies:
                  remark-parse:
                    specifier: 'catalog:'
                    version: 11.0.0(supports-color@7.2.0)
                  ts-morph:
                    specifier: 'catalog:'
                    version: 28.0.0
                  unified:
                    specifier: 'catalog:'
                    version: 11.0.5
                  unist-util-visit:
                    specifier: 'catalog:'
                    version: 5.1.0
          """
          new_core = """  packages/core:
                dependencies:
                  satteri:
                    specifier: 'catalog:'
                    version: 0.9.5
                  ts-morph:
                    specifier: 'catalog:'
                    version: 28.0.0
          """
          if content.count(old_core) != 1:
              raise SystemExit('core importer block not found exactly once')
          content = content.replace(old_core, new_core)

          path.write_text(content)
          PY

          git add pnpm-lock.yaml
          git rm .github/workflows/minimize-satteri-catalog-lockfile.yml
          git commit -m "Minimize Satteri catalog lockfile changes"
          git push
