name: prepare-monaco-browser-tests

on:
  push:
    branches:
      - test/monaco-browser-intellisense
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-monaco-browser-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sterashima78'
          cache: pnpm
      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile"
          git push
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
      - name: Install Chromium
        run: pnpm --filter @sterashima78/ts-md-monaco exec playwright install --with-deps chromium
      - name: Run Lint
        run: pnpm lint
      - name: Run Type Check
        run: pnpm typecheck
      - name: Run Build
        run: pnpm build
      - name: Run Tests
        run: pnpm test
