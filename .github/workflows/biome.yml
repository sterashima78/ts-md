name: check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sterashima78'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @sterashima78/ts-md-monaco exec playwright install --with-deps chromium
      - name: Run Lint
        run: pnpm lint
      - name: Run Type Check
        run: pnpm typecheck
      - name: Run Build
        run: pnpm build
      - name: Install TypeScript 7.1 Beta
        run: npm install --prefix "$RUNNER_TEMP/ts-md-typescript-beta" --no-save --no-audit --no-fund --ignore-scripts --package-lock=false typescript@7.1.0-beta
      - name: Run native TypeScript Content Mapper integration
        env:
          TSMD_TSC_PATH: ${{ runner.temp }}/ts-md-typescript-beta/node_modules/typescript/bin/tsc
        run: pnpm --filter @sterashima78/ts-md-content-mapper test:beta
      - name: Run Tests
        run: pnpm test
