name: Fix Satteri lockfile indentation

on:
  push:
    branches:
      - agent/use-satteri-markdown-parser
    paths:
      - .github/workflows/fix-satteri-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - pnpm-lock.yaml
      - .github/workflows/fix-satteri-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/use-satteri-markdown-parser
      - run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          content = path.read_text()
          importer = content.index('  packages/core:\n')
          dependencies = content.index('    dependencies:\n', importer)
          dev_dependencies = content.index('    devDependencies:\n', dependencies)
          replacement = (
              '    dependencies:\n'
              '      satteri:\n'
              '        specifier: 0.9.5\n'
              '        version: 0.9.5\n'
              '      ts-morph:\n'
              '        specifier: 28.0.0\n'
              '        version: 28.0.0\n'
          )
          path.write_text(
              content[:dependencies] + replacement + content[dev_dependencies:]
          )
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git rm .github/workflows/fix-satteri-lockfile.yml
          git commit -m "Fix Satteri lockfile indentation"
          git push
